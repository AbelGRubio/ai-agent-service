[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "observe-core",
  "litellm==1.89.3",
  "langchain_community",
  "langchain[openai]",
  "openai",
  "copilotkit",
  "langgraph",
  "pydantic_settings",
  "langchain-openai",
  "langchain-mcp-adapters",
  "langgraph-cli[inmem]",
  "langgraph-sdk>=0.4.2",
  "pyjwt>=2.13.0",
]

[tool.uv.sources]
observe-core = { path = "../../libs/observe_core", editable = false }

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "pyrefly==0.47.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cookies==0.7.0",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
    "ruff==0.14.11",
    "ty==0.0.10",
    "python-semantic-release>=10.5.2",
    "nodejs>=0.1.1", # required for pyright
    "pyright>=1.1.400",
    "build",
    "twine",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-n",
    "auto",
    "--cov=src",
    "--cov-report=xml",
    "--cov-report=json",
    "--cov-report=html",
    "--cov-report=term-missing",
]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_files = "test_*.py tests_*.py *_test.py"
python_classes = "*Test Test* Describe*"
python_functions = "test_* it_* should_* scenario_*"

[tool.coverage.run]
omit = [
    "src/__main__.py",
]

[tool.coverage.report]
fail_under = 80          # número entero o float (ej: 85.5)
precision = 2            # cuántos decimales mostrar

[tool.ruff]
preview = true
target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [".venv", "build", "dist", "notebooks_extra", "tests", "src/__main__.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["observe_agent"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"**/notebooks_extra/**" = ["ALL"]
"**.ipynb" = ["E501", "D100", "D103", "D101", "E402", "I002", "T201"]
"**/__init__.py" = ["D104", "F401"]
"tests/**" = ["S101", "D103", "D100", "D104", "SLF001", "B018"]

[tool.ty.rules]

[tool.ty.environment]
python = "./.venv"
python-version = "3.14"
python-platform = "linux"
root = ["."]
extra-paths = []

[tool.ty.src]
respect-ignore-files = false
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/*venv/**/*", "./build", "**/__main__.py"]

[tool.pyrefly]
use-ignore-files = false
project-includes = ["src"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
    "**/tests", "**/__main__.py"
]
search-path = [
    "src",
    # ".venv/lib/python3.14/site-packages",
    ".venv/Lib/site-packages",
]
python-platform = "win32"
python-version = "3.14"
python-interpreter-path = ".venv/Scripts/python.exe"

