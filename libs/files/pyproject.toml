[project]
name = "pygenai-files"
version = "0.1.0"
description = "Vendored filesystem library for pygenai"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3==1.43.95",
    "botocore==1.43.95",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygenai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
