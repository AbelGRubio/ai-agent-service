version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: pygenai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: pygenai-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  qdrant_data:
  chroma_data:
