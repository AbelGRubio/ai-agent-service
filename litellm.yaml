model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_base: "https://eu.api.openai.com/v1"
      api_key: "os.environ/OPENAI_API_KEY_PRUEBA"
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: "https://eu.api.openai.com/v1"
      api_key: "os.environ/OPENAI_API_KEY_PRUEBA"
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_base: "https://eu.api.openai.com/v1"
      api_key: "os.environ/OPENAI_API_KEY_PRUEBA"
  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_base: "https://generativelanguage.googleapis.com/v1beta"
      api_key: "os.environ/GOOGLE_API_KEY_PRUEBA"

general_settings:
  master_key: "sk-1234"
  otel: true # Habilita la exportación a OTEL

litellm_settings:
  callbacks: ["otel"]
  service_callbacks: ["prometheus"]
